# Docs/Specs/LOCALIZATION_SCHEMA.yaml — Localization Configuration
# SPEC-133 | Authority: Level 4 (Declarative Spec)

localization:
  supported_locales:
    - "es-MX"
    - "en-US"
    - "ja-JP"
  string_format: "ICU MessageFormat"
  fallback_locale: "en-US"
  interpolation_syntax: "{variable}"
  wrap_width_chars: 42
  overflow: "truncate_ellipsis"
  text_bounds:
    ui_button_max_chars: 18
    hud_label_max_chars: 24
    subtitle_max_chars_per_line: 42
    subtitle_max_lines: 2
  font_fallbacks:
    - "Inter"
    - "Noto Sans JP"
    - "Noto Sans SC"
  csv_encoding: "UTF-8"
  csv_delimiter: ","
  csv_quote_char: '"'
  csv_escape_char: '"'
  key_naming_convention: "snake_case"
  namespace_prefix: "echoes."