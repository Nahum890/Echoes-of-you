# Docs/Specs/LOCALIZATION_SCHEMA.yaml (SPEC-133)
default_locale: "es-MX"
supported_locales: ["es-MX", "en-US"]

table_path: "Assets/Localization/"
tables:
  UI:
    file: "UI_es-MX.csv"
    encoding: "UTF-8"
    format: "key,value"
    example:
      key: "menu.play"
      value: "Jugar"
  Narrative:
    file: "Narrative_es-MX.csv"
    example:
      key: "level01.memory.coat"
      value: "El abrigo de Lyra"

font_fallback:
  primary: "Inter-Regular SDF"
  fallback: "Arial"
  emoji_font: "Noto Color Emoji"

string_format:
  dynamic_params: "{{key}}"  # ej: "Nivel {{levelNumber}}"
  max_length_ui: 64          # caracteres máximos en UI strings
