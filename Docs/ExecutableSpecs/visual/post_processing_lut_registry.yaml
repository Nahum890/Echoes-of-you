# Docs/ExecutableSpecs/visual/post_processing_lut_registry.yaml
# Post-Processing LUT Registry - Color Grading Lookup Tables
# SPEC-EXEC-PP-LUT | Authority: Level 3 (Runtime Data Contract)

post_processing_lut_registry:
  lut_assets:
