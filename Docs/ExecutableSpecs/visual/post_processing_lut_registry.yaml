    - chapter: "III"
      name: "LUT_Ch3_Confianza"
      guid: "00000000000000000000000000000003"
      intensity_range: [0.0, 1.0]
      blend_mode: "linear"

    - chapter: "IV"
      name: "LUT_Ch4_Optimizacion"
      guid: "00000000000000000000000000000004"
      intensity_range: [0.0, 1.0]
      blend_mode: "linear"

    - chapter: "V"
      name: "LUT_Ch5_Consecuencia"
      guid: "00000000000000000000000000000005"
      intensity_range: [0.0, 1.0]
      blend_mode: "linear"

    - chapter: "VI"
      name: "LUT_Ch6_Integracion"
      guid: "00000000000000000000000000000006"
      intensity_range: [0.0, 1.0]
