  _global_collider:
    strategy: "PullCameraForward"
    collision_filter: "Default,Environment,Architecture"
    ignore_tag: "Player"
    minimum_distance_from_target_m: 1.5
    damping_into_collider: 0.0
    damping_from_collider: 0.5
    optimal_target_distance_m: 2.0
    lookAt_deadzone: {w: 0.1, h: 0.1}
    lookAt_softzone: {w: 0.8, h: 0.8}

rules:
  - id: CAM-VAL-001
    type: validation
    status: active
    severity: fatal
    scope: [camera, blueprint]
    rule: "Production Blueprint cameraProfile reference must resolve to a CameraProfile asset"
    validator: validators/camera_validator.yaml#profile_reference
  - id: CAM-VAL-002
    type: prohibition
    status: active
    severity: fatal
    scope: [camera, level]
    rule: "Cinemachine and ThirdPersonCamera must not both write camera transform in one scene"
    validator: validators/camera_validator.yaml#controller_exclusivity
  - id: CAM-VAL-003
    type: validation
    status: active
    severity: error
    scope: [camera, echo]
    rule: "Active Echo must be represented in the camera target group during playback"
    validator: validators/camera_validator.yaml#echo_target
