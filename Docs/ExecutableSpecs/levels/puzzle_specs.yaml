    echo_required: true
    button_test: pass_required
    stages: [void_observation, echo_path, follow_without_control, landing]
    required_components: [EchoRecorder, GravityZone, EchoPathHint]
    implementation_status: partial
    failure_recovery: scene_reload
  N15:
    id: PUZ-N15
    archetype: mastery
    core_idea: "Integration is returning to the beginning with a different choice"
    echo_required: true
    button_test: pass_required
    stages: [recognize_n01, integrate_learned_rules, final_echo, exit]
    required_components: [EchoRecorder, LevelExit, narrative_payoff]
    implementation_status: partial
    failure_recovery: scene_reload

validation:
  - id: PUZ-MAT-001
    type: validation
    status: active
    severity: error
    scope: [level, puzzle]
    rule: "Every level must have one puzzle spec and one Blueprint asset"
    validator: validators/blueprint_validator.yaml#puzzle_mapping
