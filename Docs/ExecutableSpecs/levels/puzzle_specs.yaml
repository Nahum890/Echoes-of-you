schema_version: "1.0"
catalog_type: level_puzzle_specifications
implementation_status_policy: "design_target until runtime evidence is attached"

puzzles:
  N01:
    id: PUZ-N01
    archetype: teaching
    core_idea: "An Echo is a deterministic physical trace of a past action"
    echo_required: true
    button_test: pass_required
    stages: [observe_echo, record_short_path, activate_first_condition, reach_exit]
    required_components: [EchoRecorder, EchoPlayback, PressurePlate, LevelExit]
    failure_recovery: re_record_before_playback
  N02:
    id: PUZ-N02
    archetype: experimentation
    core_idea: "A past action can remain active while the present performs another task"
    echo_required: true
    button_test: pass_required
    stages: [single_plate_teaching, two_plate_variation, parallel_route, payoff]
    required_components: [EchoRecorder, PressurePlate, PuzzleSignal, DoorController]
    failure_recovery: re_record_or_scene_reload
  N03:
    id: PUZ-N03
    archetype: experimentation
    core_idea: "The same action can create different consequences depending on route choice"
    echo_required: true
    button_test: pass_required
    stages: [mirror_observation, route_discovery, echo_route_choice, exit]
    required_components: [EchoRecorder, PressurePlate, PuzzleCondition]
    failure_recovery: re_record_or_scene_reload
  N04:
    id: PUZ-N04
    archetype: teaching
    core_idea: "Timing is read and planned, not reacted to"
    echo_required: true
    button_test: pass_required
    stages: [observe_vertical_cycle, safe_timing, echo_timing, payoff]
    required_components: [EchoRecorder, TimedMovingPlatform, PressurePlate]
    failure_recovery: re_record
  N05:
    id: PUZ-N05
    archetype: experimentation
    core_idea: "A recorded route can become an obstacle as well as a solution"
    echo_required: true
    button_test: pass_required
    stages: [route_observation, obstruction_discovery, timed_crossing, payoff]
    required_components: [EchoRecorder, EchoPlayback, PuzzleCondition]
    failure_recovery: re_record_or_scene_reload
  N06:
    id: PUZ-N06
    archetype: twist
    core_idea: "The Echo reveals a bridge that does not exist for the present"
    echo_required: true
    button_test: pass_required
    stages: [library_observation, absent_path, bridge_reveal, crossing, narrative_payoff]
    required_components: [EchoRecorder, TemporalBridge, EchoPlayback]
    implementation_status: partial
    failure_recovery: re_record
  N07:
    id: PUZ-N07
    archetype: twist
    core_idea: "The player must prepare a future action before its condition exists"
    echo_required: true
    button_test: pass_required
