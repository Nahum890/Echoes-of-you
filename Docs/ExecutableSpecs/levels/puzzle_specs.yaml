    core_idea: "Two past decisions can cooperate or sabotage one another"
    echo_required: true
    button_test: pass_required
    stages: [single_echo_recap, second_echo_variation, conflict, coordination, payoff]
    required_components: [EchoRecorder, EchoConflictTrap, PuzzleWire]
    implementation_status: partial
    failure_recovery: scene_reload
  N09:
