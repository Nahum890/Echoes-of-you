    stages: [stair_reading, lower_route, upper_route, synchronization, exit]
    required_components: [EchoRecorder, SchoolStairwell, PressurePlate]
    failure_recovery: re_record
  N12:
    id: PUZ-N12
    archetype: twist
    core_idea: "Contradictory Echoes create consequences instead of progress"
    echo_required: true
    button_test: pass_required
    stages: [conflict_teaching, two_echo_setup, contradiction, safe_resolution, payoff]
    required_components: [EchoConflictTrap, PuzzleCondition, EchoRecorder]
    implementation_status: partial
    failure_recovery: scene_reload
  N13:
    id: PUZ-N13
