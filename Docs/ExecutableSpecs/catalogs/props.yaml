schema_version: "1.0"
catalog_type: prop_catalog
unit_system: meters
runtime_authority: Assets/Prefabs
verification_policy: "filesystem_present does not mean collider/material/runtime_validated"

global_rules:
  min_separation: 0.4
  max_density_per_10m2: 6
  allowed_rotation_snap_degrees: [0, 90, 180, 270]
  classroom_rotation_jitter_degrees: 15
  allowed_scale_variance: 0.05
  no_floating: true
  no_wall_clipping: true
  no_doorway_blocking: true

