validation:
  - id: PROP-VAL-001
    type: validation
    status: active
    severity: error
    scope: [prop, level]
    rule: "Every referenced prefab path must exist under Assets"
    validator: validators/static_validator.yaml#asset_paths
  - id: PROP-VAL-002
    type: validation
    status: active
    severity: error
    scope: [prop, level]
    rule: "No static prop collider may intersect a primary navigation route"
    validator: validators/level_validator.yaml#prop_overlaps
  - id: PROP-VAL-003
    type: validation
    status: active
    severity: warning
    scope: [prop]
    rule: "Every narrative prop must have a narrative weight and allowed placement"
    validator: validators/static_validator.yaml#narrative_metadata
