validation:
  - id: ROOM-VAL-001
    type: mapping
    status: active
    severity: fatal
    scope: [room, blueprint]
    rule: "Every room template must map to a valid ModuleType enum value"
  - id: ROOM-VAL-002
    type: constraint
    status: active
    severity: error
    scope: [room]
    rule: "Every room must define at least one entrance and one exit"
  - id: ROOM-VAL-003
    type: validation
    status: active
    severity: warning
    scope: [room]
    rule: "Every room should define camera and lighting profiles"
