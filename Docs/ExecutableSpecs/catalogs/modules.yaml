custom_data_contract:
  syntax: "key=value;key=value"
  status: partial
  limitation: "Current ModulePlacement.customData is a free-form string; supported keys must be verified per factory method"
  unknown_key_behavior: warning
  malformed_value_behavior: error

validation:
  - id: MODULE-VAL-001
    type: mapping
    status: active
    severity: fatal
    scope: [module, blueprint]
    rule: "Every catalog module value must match exactly one LevelBlueprint.ModuleType enum value"
  - id: MODULE-VAL-002
    type: mapping
    status: active
    severity: error
    scope: [module]
    rule: "Every module must have a matching factory case or be explicitly marked unsupported"
  - id: MODULE-VAL-003
    type: validation
    status: blocked
    severity: error
    scope: [module]
    rule: "Every customData key must be verified against the factory parser"
