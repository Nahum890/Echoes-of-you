# Docs/ExecutableSpecs/catalogs/asset_guid_registry.yaml (SPEC-126)
# Authoritative registry of prefab GUIDs resolved against AssetDatabase.
# Aligned to module-composition model (Q5 locked decision): no named room
# prefabs — rooms are composed at build time by EchoesModuleFactory from the
# modular Arch_* primitives listed below. The Player GameObject is assembled
# procedurally by EchoesLevelShell.SpawnPlayer (no Player.prefab asset).
#
# REGLA: Todo agente que deba instanciar un GameObject DEBE consultar este archivo
# primero. Si la entrada no existe aqui, falla ACK-001 y debe documentarse antes
# de instanciar. Validado por ExecutableSpecValidator.CheckGuidRegistry (ACK-001).
canonical_source: Docs/ExecutableSpecs/catalogs/asset_guid_registry.yaml
resolution_mechanism: AssetDatabase.GUIDToAssetPath
schema_version: "1.0"

registry:
