  # Player: sin prefab — EchoesLevelShell.SpawnPlayer crea el GameObject en runtime
  PlayerGameObject:
    path: ""
    factory_source: Assets/Editor/EchoesLevelShell.cs#SpawnPlayer
    type: procedural GameObject
    note: "No Player.prefab asset — assembled at spawn via code + CapsuleCollider + CinemachineBrain"
