# ───────────────────────────────────────────────────────────
# VALIDATION
# ───────────────────────────────────────────────────────────
validation:
  - id: VN-END-VAL-001
    type: constraint
    severity: error
    scope: [vn_system]
    rule: "Todos los 32 canonical_test_paths deben resolver a ending_id válido"
    validator: Assets/Tests/EditMode/VN_EndingResolverTests.cs
  - id: VN-END-VAL-002
    type: constraint
    severity: error
    scope: [vn_system, narrative]
    rule: |
      Solo Aceptación settea salir_del_colegio = true.
      Otros 4 endings = false o "partial".
    validator: Assets/Tests/EditMode/VN_EndingFlagsTests.cs
  - id: VN-END-VAL-003
    type: constraint
    severity: error
    scope: [vn_system, narrative]
    rule: |
      ambiguity_police: 0 ocurrencias en voice_final / narration_key de
      ["amiga", "novia", "pareja", "relación", "amistad", "nos amamos"].
    validator: Assets/Tests/EditMode/AmbiguityPoliceTests.cs
  - id: VN-END-VAL-004
    type: constraint
    severity: error
    scope: [vn_system, narrative]
    rule: |
      dual_thesis_police: voice_final y narration_key no concluyen:
      ["tenía razón", "tenía la culpa", "estuvo bien", "perdoné",
      "ya está bien", "fui inocente"]. ANTI-BIB-005.
    validator: Assets/Tests/EditMode/DualThesisPoliceTests.cs
  - id: VN-END-VAL-005
    type: constraint
    severity: error
    scope: [vn_system]
    rule: |
      Resolución determinista: dado un set de flags A y B donde
      comprehension(A) == comprehension(B), resolver(A) == resolver(B).
      No random, no heuristic.
    validator: Assets/Tests/EditMode/VN_DeterminismTests.cs

# ───────────────────────────────────────────────────────────
# CHANGE HISTORY
# ───────────────────────────────────────────────────────────
change_history:
  - version: "1.0"
    date: "2026-07-25"
    note: "Initial VN_ENDING_RESOLVER.yaml con endings Void/Obsession/Release/Resonance/Integration"
  - version: "2.0"
    date: "2026-08-02"
    note: |
      Renombrado a Aislamiento/Ruminación/Negociación/Desesperación/Aceptación.
      Añadidos: comprehension_tiers, stage_threshold_by_level, flag_catalog,
      32 canonical_test_paths, resolution_algorithm, 5 validaciones (incl.
      ambiguity_police y dual_thesis_police). Mapeo de flags "abrir" vs
      "mantener" formalizado. Salto cualitativo: Aceptación requiere tanto
      comprehensión alta COMO hard flags individuales (let_go_pain,
      break_pattern_n15, touch_lyra_object, follow_echo). No es solo cuantitativo
      — requiere flags duros específicos.
