<script>
        // Simple typing effect to simulate "struggling processor" narrative delivery
        document.addEventListener('DOMContentLoaded', () => {
            const textToType = "A veces siento que este lugar me conoce mejor que yo misma.";
            const textElement = document.getElementById('dialogue-text');
            const cursorElement = document.getElementById('dialogue-cursor');
            let index = 0;

            function typeChar() {
                if (index < textToType.length) {
                    textElement.textContent += textToType.charAt(index);
                    index++;
                    // Introduce slight random delay for analog feel
                    const delay = Math.random() * 50 + 20; 
                    setTimeout(typeChar, delay);
                } else {
                    cursorElement.classList.remove('opacity-0');
                }
            }

            // Start typing shortly after load
            setTimeout(typeChar, 400);
        });
    </script>
