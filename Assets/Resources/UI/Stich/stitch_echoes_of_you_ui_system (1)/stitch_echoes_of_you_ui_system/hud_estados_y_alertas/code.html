<style>
        /* Custom Scanline & Glitch Effects */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.3;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.95; }
        }
        
        .echo-trail {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            transform: translate(4px, 4px);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
            filter: blur(1px);
        }

        .glitch-text {
            position: relative;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        .glitch-text::before {
            color: #63d4fa; /* tertiary-fixed-dim */
            z-index: -1;
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            color: #ffb4ab; /* error */
            z-index: -2;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 1px); }
            40% { clip-path: inset(30% 0 40% 0); transform: translate(2px, -2px); }
            60% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, 2px); }
            80% { clip-path: inset(5% 0 80% 0); transform: translate(1px, -1px); }
            100% { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 1px); }
        }
        
        .typewriter-delay {
            opacity: 0;
            animation: fadeIn 0.1s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .pulse-error {
            animation: pulseError 2s infinite;

<script>
        // Simple typewriter delay effect for the checkpoint text to simulate processing
        document.addEventListener('DOMContentLoaded', () => {
            const textElement = document.getElementById('checkpoint-text');
            const originalHTML = textElement.innerHTML;
            const textNodes = Array.from(textElement.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);
            
            if(textNodes.length > 0) {
                const textContent = textNodes[0].textContent.trim();
                textNodes[0].textContent = '';
                
                let i = 0;
                const typeWriter = setInterval(() => {
                    if (i < textContent.length) {
                        textNodes[0].textContent += textContent.charAt(i);
                        i++;
                    } else {
                        clearInterval(typeWriter);
                    }
                }, 50); // Frame-skipping delay feel
            }
        });
    </script>
