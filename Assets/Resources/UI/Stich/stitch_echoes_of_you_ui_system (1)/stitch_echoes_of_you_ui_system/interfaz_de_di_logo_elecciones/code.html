        .choice-btn {

            inset: 0;
            border: 1px solid theme('colors.aged-ivory');

            transition: all 0.3s ease;

            opacity: 0.3;
        }

            border-color: theme('colors.memory-amber');
            opacity: 1;
        }

<script>
        // Simple script to add slight delay effect to text to simulate struggling processor
        document.addEventListener('DOMContentLoaded', () => {
            const headerText = document.querySelector('h1');
            const originalText = headerText.textContent;
            headerText.textContent = '';
            
            let i = 0;
            const typeWriter = () => {
                if (i < originalText.length) {
                    headerText.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(typeWriter, Math.random() * 50 + 20); // random delay between 20-70ms
                }
            };
            
            setTimeout(typeWriter, 500); // Start after 500ms
        });
    </script>
