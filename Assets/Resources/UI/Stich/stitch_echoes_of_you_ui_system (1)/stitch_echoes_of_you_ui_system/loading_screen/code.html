<style>
        /* Custom animations for loading screen */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.1; }
            50% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.1; }
        }
        
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .echo-ring {
            animation: pulse-ring 3s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(99, 212, 250, 0.4);
        }
        
        .progress-spinner {
            animation: spin-slow 8s linear infinite;
        }
        
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
        }

        /* Glitch effect for text */
        .glitch-text {
            position: relative;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
        }
        .glitch-text::before {
            color: #63d4fa; /* tertiary-fixed-dim */
            z-index: -1;
            transform: translate(-1px, 1px);
        }
        .glitch-text::after {
            color: #ffb4ab; /* error */
            z-index: -2;
            transform: translate(1px, -1px);
        }
        
        .typing-effect {
            overflow: hidden;
            white-space: nowrap;
            border-right: 1px solid #e4e2dc; /* on-surface */
            animation: typing 4s steps(40, end), blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #e4e2dc; }
        }
    </style>

<script>
        // Simple script to randomly glitch the main text occasionally
        document.addEventListener('DOMContentLoaded', () => {
            const title = document.querySelector('h1');
            
            setInterval(() => {
                if(Math.random() > 0.8) {
                    title.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                    setTimeout(() => {
                        title.style.transform = 'translate(0, 0)';
                    }, 100);
                }
            }, 2000);
        });
