        body {
            background-color: #000;
            color: #e4e2dc;
        }

        .broken-o {
            position: relative;
            display: inline-block;
        }
        .broken-o::after {
            content: '';
            position: absolute;
            top: 40%;
            left: -10%;
            width: 120%;
            height: 2px;
            background: #131410;
            transform: rotate(-15deg);
        }

        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
        }

        .glitch-hover:hover {
            transform: translate(1px, 1px);
            text-shadow: 1px 0px 0px rgba(99, 212, 250, 0.5), -1px 0px 0px rgba(105, 0, 5, 0.5);
            background-color: rgba(20, 28, 40, 0.8);
        }
        
        .focused-btn {
            border-color: #63d4fa !important;
            background-color: rgba(20, 28, 40, 0.8);
            text-shadow: 1px 0px 0px rgba(99, 212, 250, 0.5), -1px 0px 0px rgba(105, 0, 5, 0.5);
        }

        .echo-silhouette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.1;
            transform: translate(4px, 2px);
            filter: blur(1px);
            z-index: -1;
        }
    </style>
