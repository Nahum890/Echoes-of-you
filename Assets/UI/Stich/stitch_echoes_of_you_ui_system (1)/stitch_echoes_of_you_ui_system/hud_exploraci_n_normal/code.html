<style>

            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
        }

        .glitch-hover:hover {
            text-shadow: 1px 0px 1px rgba(99, 212, 250, 0.7), -1px 0px 1px rgba(255, 180, 171, 0.7);
            transform: translate(1px, 0.5px);

<div class="absolute inset-0 bg-cover bg-center object-cover z-0" data-alt="A moody, atmospheric 3D environment depicting a dilapidated institutional school corridor. Soft, melancholic lighting filters through dusty windows, casting long shadows across peeling paint and worn linoleum floors. The scene is rendered with a dark, cinematic tone, dominated by deep navy blues and faded amber hues, evoking a sense of corrupted memory and abandonment. Subtle atmospheric fog and floating dust motes add depth and a tactile sense of decay to the eerie, silent hallway." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAcM7-zSbZZMQR8rjNsTn07V8X_aKRcUqUj2x1PBcYXD7jI1puSedLLKKChv_1HwfrI3VLBPtLxZTAUB6A84wL4_FIgoFU6tVBrNF7LA7OSK6tPfpK0ZfCa2VnCre4of5AOrzj80PF5EFmqf0ktoJoEw72Xa1cBhokUtKGExIdF-2FI-cMoGsPfjglKZW4TT3D0RHeAbbWKaRU5xK20a_kiTnEcH7NhViSXgRkMtJr6_j2Ser2g_8Jvug')"></div>

<div class="absolute inset-0 scanlines opacity-30 pointer-events-none z-0 mix-blend-overlay"></div>
<!-- Gameplay HUD Container -->
<div class="absolute inset-0 p-margin-edge pointer-events-none z-10 flex flex-col justify-between">
<!-- Top Left: Metadata Tag -->
<div class="self-start flex flex-col items-start">
<div class="font-label-caps text-label-caps text-tertiary-fixed-dim/60 text-[10px] tracking-widest mb-1 pl-1">SYS.LOC.DATA</div>
<div class="flex items-center gap-3 bg-surface-container/20 backdrop-blur-md border-l border-outline/50 py-1.5 px-3">
<span class="material-symbols-outlined text-outline-variant text-base" style="font-variation-settings: 'FILL' 0;">location_on</span>
<span class="font-interface-sm text-interface-sm text-on-surface/90 drop-shadow-md tracking-wider uppercase">Archivo: Corredor Este</span>
</div>
<!-- Glitch decoration line -->
<div class="w-full max-w-[120px] h-[1px] bg-gradient-to-r from-tertiary-fixed-dim/40 to-transparent mt-2 ml-1"></div>
</div>
<!-- Center: Interaction Prompt (Environmental Anchor) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative flex flex-col items-center transform translate-y-12"> <!-- Slightly offset downwards simulating looking at a door handle -->
<!-- Target Reticle -->
<div class="w-8 h-8 border-[0.5px] border-on-surface/30 rounded-full flex items-center justify-center mb-6 relative">
<div class="absolute w-full h-[1px] bg-on-surface/20"></div>
<div class="absolute h-full w-[1px] bg-on-surface/20"></div>
<div class="w-1.5 h-1.5 bg-tertiary-fixed-dim rounded-full opacity-80 shadow-[0_0_8px_rgba(99,212,250,0.5)]"></div>
</div>
<!-- Prompt Button -->
<div class="flex items-center gap-4 bg-surface/40 backdrop-blur-md border border-outline-variant/40 px-5 py-2 pointer-events-auto cursor-pointer transition-all duration-300 hover:bg-surface-container/80 hover:border-tertiary-fixed-dim group glitch-hover">
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-tertiary-fixed-dim transition-colors opacity-70">[ F ]</span>
<span class="font-interface-md text-interface-md text-primary tracking-widest uppercase drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">Abrir</span>
</div>
</div>
</div>
<!-- Bottom Right: Echo HUD -->
<div class="self-end flex items-center gap-4">
<!-- Contextual Data -->
<div class="flex flex-col items-end gap-0.5 opacity-60">
<span class="font-interface-sm text-[12px] text-on-surface tracking-widest uppercase">Resonancia</span>
<span class="font-interface-sm text-[11px] text-tertiary-fixed-dim font-bold">ACTIVA_</span>
</div>
<!-- Broken O Emblem (Compact) -->
<div class="relative w-14 h-14 flex items-center justify-center">
<!-- Delayed Silhouette (Ghost outline) -->
<svg class="absolute inset-0 w-full h-full opacity-30 -translate-x-[2px] translate-y-[2px]" viewbox="0 0 100 100">
<circle class="text-tertiary-fixed-dim" cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-dasharray="180 100" stroke-dashoffset="20" stroke-width="2" transform="rotate(-30 50 50)"></circle>
</svg>
<!-- Primary Broken Rings -->
<svg class="absolute inset-0 w-full h-full animate-[spin_30s_linear_infinite]" viewbox="0 0 100 100">
<!-- Outer Ivory Ring (Incomplete) -->
<circle class="text-on-surface" cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-dasharray="210 70" stroke-dashoffset="0" stroke-width="2.5" transform="rotate(45 50 50)"></circle>
<!-- Inner Cyan Ring (Fragmented) -->
<circle class="text-tertiary-fixed-dim" cx="50" cy="50" fill="none" r="38" stroke="currentColor" stroke-dasharray="80 200" stroke-dashoffset="40" stroke-width="1" transform="rotate(-15 50 50)"></circle>
<circle class="text-tertiary-fixed-dim" cx="50" cy="50" fill="none" r="38" stroke="currentColor" stroke-dasharray="20 260" stroke-dashoffset="140" stroke-width="1.5" transform="rotate(-15 50 50)"></circle>
</svg>
<!-- Core Indicator -->
<div class="w-1 h-1 bg-tertiary-fixed-dim rounded-full animate-pulse shadow-[0_0_10px_rgba(99,212,250,0.8)]"></div>
</div>
