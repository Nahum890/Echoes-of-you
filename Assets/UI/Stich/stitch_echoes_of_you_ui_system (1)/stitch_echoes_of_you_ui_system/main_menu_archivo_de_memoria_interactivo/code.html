<style>
        body {
            background-color: #131410;
            color: #e4e2dc;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Echo Trails and Chromatic Aberration effects */
        .echo-hover {
            position: relative;
            transition: all 0.3s ease;
        }

        .echo-hover::before {
            content: attr(data-text);
            position: absolute;
            left: -4px;
            top: 2px;
            color: rgba(99, 212, 250, 0.5); /* Cyan echo */
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: -1;
            pointer-events: none;
        }

        .echo-hover::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: -1px;
            color: rgba(99, 212, 250, 0.5); /* Cyan text-echo as requested */
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: -2;
            pointer-events: none;
        }

        .echo-hover:hover, .echo-hover:focus {
            color: #fffeff; /* Pure white on hover */
            text-shadow: 0 0 8px rgba(255, 254, 255, 0.3);
        }

        .echo-hover:hover::before, .echo-hover:focus::before {
            opacity: 1;
            transform: translate(-2px, 0); /* 2px horizontal displacement */
        }

        .echo-hover:hover::after, .echo-hover:focus::after {
            opacity: 1;
            transform: translate(2px, 0); /* 2px horizontal displacement */
        }

        /* Glitch/Jitter effect for active/hover */
        @keyframes microJitter {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, 0); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0, 0); }
        }

        .hover-jitter:hover, .hover-jitter:focus {
            animation: microJitter 0.15s infinite alternate; /* 150ms micro-jitter on focus */
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.3;
        }

        /* Noise Texture */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 49;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Custom selection */
        ::selection {
            background: rgba(99, 212, 250, 0.3);
            color: #fffeff;
        }
    </style>

<script>
        // Simple script to add slight random delays to hover animations to simulate glitchiness
        document.querySelectorAll('.echo-hover').forEach(el => {
            el.addEventListener('mouseenter', () => {
                const delay = Math.random() * 100;
                el.style.transitionDelay = `${delay}ms`;
            });
            el.addEventListener('mouseleave', () => {
                el.style.transitionDelay = '0ms';
            });
        });
