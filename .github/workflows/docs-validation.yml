name: Echoes of You - Validación y tests de Unity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_UNITY_VERSION: 6000.4.3f1

jobs:
  contrato:
    name: Contrato del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar versión y assembly de tests
        run: |
          set -euo pipefail
          actual=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          if [ "$actual" != "$EXPECTED_UNITY_VERSION" ]; then
            echo "::error::ProjectVersion.txt dice '$actual'; se esperaba '$EXPECTED_UNITY_VERSION'."
            exit 1
          fi
          grep -q '"com.unity.test-framework"' Packages/manifest.json
          grep -q '"name": "Echoes.Tests"' Assets/Tests/Echoes.Tests.asmdef
          echo "Unity $actual y Echoes.Tests verificados."

  editmode-tests:
    name: Tests EditMode (Unity 6000.4.3f1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: contrato
    # Los PR de forks no reciben secretos; se validan con el job de contrato.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar licencia de Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "${UNITY_LICENSE:-}" ]; then
            echo "::error::Falta el secreto UNITY_LICENSE. Añádelo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Cache de Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.EXPECTED_UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.EXPECTED_UNITY_VERSION }}-

      - name: Ejecutar tests EditMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          testMode: EditMode
          coverageEnabled: false
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: artifacts/editmode
          if-no-files-found: warn
